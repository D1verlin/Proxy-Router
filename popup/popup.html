<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Proxy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="../icons/Proxy Router.svg" class="brand-icon" alt="Proxy Router" width="28" height="28">
        <div class="brand-text">
          <span class="brand-title">PROXY ROUTER</span>
          <span class="brand-sub">Selective routing</span>
        </div>
      </div>
      
      <!-- Master Switch -->
      <label class="switch-control" aria-label="Включить или выключить маршрутизацию">
        <input type="checkbox" id="masterToggle" checked>
        <span class="switch-slider"></span>
      </label>
    </header>

    <!-- Status Monolith Card -->
    <div id="statusBanner" class="status-card status-checking">
      <div class="status-left">
        <span class="status-dot"></span>
        <span id="statusText" class="status-label">CHECKING...</span>
      </div>
      <div id="proxyServerDisplay" class="status-endpoint">2.27.25.190:3128</div>
    </div>

    <!-- Whitelist Warning Card (Shown when proxy rejects connection or IP not whitelisted) -->
    <div id="whitelistCard" class="whitelist-card hidden">
      <div class="whitelist-info">
        <div class="whitelist-header">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span class="whitelist-title">IP NOT IN WHITELIST</span>
        </div>
        <p class="whitelist-desc">Proxy access is restricted. Add your IP via Telegram bot.</p>
      </div>
      <div class="whitelist-actions">
        <a href="https://t.me/proxymokis_bot" target="_blank" class="btn-whitelist">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          <span>@proxymokis_bot</span>
        </a>
        <button type="button" id="recheckBtn" class="btn-recheck" title="Retry connection test">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span>Recheck</span>
        </button>
      </div>
    </div>

    <!-- Quick Navigation Links -->
    <div class="quick-nav">
      <a href="https://gemini.google.com" target="_blank" class="nav-item">
        <span>Gemini</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
      <a href="https://claude.ai" target="_blank" class="nav-item">
        <span>Claude</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
      <a href="https://chatgpt.com" target="_blank" class="nav-item">
        <span>ChatGPT</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
      <a href="https://stitch.withgoogle.com" target="_blank" class="nav-item">
        <span>Stitch</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
    </div>

    <!-- Target Services Collapsible Folder -->
    <details class="monolith-accordion" id="targetsAccordion">
      <summary class="monolith-summary">
        <div class="summary-left">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          <span>ROUTED TARGETS</span>
        </div>
        <div class="summary-right">
          <span class="count-pill" id="activeTargetsCount">5/5 active</span>
          <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </summary>
      
      <div class="accordion-body">
        <div class="service-stack">
          <!-- Google -->
          <label class="service-row">
            <div class="service-meta">
              <div class="service-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </div>
              <div class="service-text">
                <span class="service-title">Google Services</span>
                <span class="service-details">google.com, gstatic, apis, drive</span>
              </div>
            </div>
            <input type="checkbox" id="presetGoogle" class="control-checkbox" checked>
          </label>

          <!-- Gemini -->
          <label class="service-row">
            <div class="service-meta">
              <div class="service-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path>
                </svg>
              </div>
              <div class="service-text">
                <span class="service-title">Google Gemini</span>
                <span class="service-details">gemini.google.com, aistudio, API</span>
              </div>
            </div>
            <input type="checkbox" id="presetGemini" class="control-checkbox" checked>
          </label>

          <!-- Claude -->
          <label class="service-row">
            <div class="service-meta">
              <div class="service-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                  <path d="M7 7h10"></path>
                  <path d="M7 12h10"></path>
                  <path d="M7 17h6"></path>
                </svg>
              </div>
              <div class="service-text">
                <span class="service-title">Anthropic Claude</span>
                <span class="service-details">claude.ai, anthropic.com, claude.site</span>
              </div>
            </div>
            <input type="checkbox" id="presetClaude" class="control-checkbox" checked>
          </label>

          <!-- OpenAI -->
          <label class="service-row">
            <div class="service-meta">
              <div class="service-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                  <rect x="9" y="9" width="6" height="6"></rect>
                  <line x1="9" y1="1" x2="9" y2="4"></line>
                  <line x1="15" y1="1" x2="15" y2="4"></line>
                  <line x1="9" y1="20" x2="9" y2="23"></line>
                  <line x1="15" y1="20" x2="15" y2="23"></line>
                  <line x1="20" y1="9" x2="23" y2="9"></line>
                  <line x1="20" y1="14" x2="23" y2="14"></line>
                  <line x1="1" y1="9" x2="4" y2="9"></line>
                  <line x1="1" y1="14" x2="4" y2="14"></line>
                </svg>
              </div>
              <div class="service-text">
                <span class="service-title">OpenAI / ChatGPT</span>
                <span class="service-details">chatgpt.com, openai.com, cdn assets</span>
              </div>
            </div>
            <input type="checkbox" id="presetOpenAI" class="control-checkbox" checked>
          </label>

          <!-- Google Stitch -->
          <label class="service-row">
            <div class="service-meta">
              <div class="service-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="6" x2="6" y1="3" y2="15"></line>
                  <circle cx="18" cy="6" r="3"></circle>
                  <circle cx="6" cy="18" r="3"></circle>
                  <path d="M18 9a9 9 0 0 1-9 9"></path>
                </svg>
              </div>
              <div class="service-text">
                <span class="service-title">Google Stitch</span>
                <span class="service-details">stitch.withgoogle.com, withgoogle</span>
              </div>
            </div>
            <input type="checkbox" id="presetGoogleStitch" class="control-checkbox" checked>
          </label>
        </div>
      </div>
    </details>

    <!-- Configuration Details -->
    <details class="monolith-accordion">
      <summary class="monolith-summary">
        <div class="summary-left">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>NETWORK CONFIGURATION</span>
        </div>
        <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </summary>
      
      <div class="accordion-body">
        <!-- Endpoint inputs -->
        <div class="field-group">
          <label class="field-label" for="proxyHost">Proxy Endpoint</label>
          <div class="endpoint-fields">
            <input type="text" id="proxyHost" class="mono-input" placeholder="2.27.25.190" value="2.27.25.190">
            <span class="colon">:</span>
            <input type="number" id="proxyPort" class="mono-input port-input" placeholder="3128" value="3128" min="1" max="65535">
          </div>
        </div>

        <!-- Fallback toggle -->
        <label class="field-checkbox">
          <input type="checkbox" id="fallbackToDirect" class="control-checkbox">
          <span>Fallback to DIRECT on proxy error</span>
        </label>

        <!-- Custom Targets -->
        <div class="field-group">
          <label class="field-label" for="customDomainInput">Custom Target Domains</label>
          <div class="input-action-row">
            <input type="text" id="customDomainInput" class="mono-input" placeholder="domain.com">
            <button type="button" id="addDomainBtn" class="btn-primary-action">Add</button>
          </div>
          <div id="customDomainsList" class="chips-container"></div>
        </div>

        <!-- Custom Bypasses -->
        <div class="field-group">
          <label class="field-label" for="customExcludeInput">Custom Bypass Domains (Direct)</label>
          <div class="input-action-row">
            <input type="text" id="customExcludeInput" class="mono-input" placeholder="direct-domain.com">
            <button type="button" id="addExcludeBtn" class="btn-primary-action">Add</button>
          </div>
          <div id="customExcludesList" class="chips-container"></div>
        </div>

        <!-- Actions -->
        <button type="button" id="resetDefaultsBtn" class="btn-secondary">Reset to Defaults</button>
      </div>
    </details>

    <!-- Notification Toast -->
    <div id="toast" class="monolith-toast hidden">Settings updated</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
